project = 'claude-field-ingest'
notes = '''
Standing inject / inject-voice rules (also durable in field-spec fs44):

Structure:
(1) live field gets synthesized thin/thick entries under real subject routes, never a monolithic claude-export dump;
(2) full transcripts stay in to-process/claude/sources/ (and field/sources/ when cited) and are cited via sources[] / links, not pasted as giant content;
(3) one conversation may seed multiple grains or none;
(4) collision-check IDs;
(5) Plumb before Chart/Profile unless user explicitly waives;
(6) shared tag claude on injected nodes for provenance;
(7) merge sources.toml rows only for sources actually cited by injected entries.

Inject-voice (readable content):
(8) Subject-matter prose first: continuous explanation of the subject, not an inventory of which source or artefact is most insightful;
(9) Digest feedstock into ordinary sentences with concrete detail, then expand insight — no 1:1 transcript dump, no "artefact X has the most insight" meta;
(10) Provenance lives in Confidence closing lines and sources[] fields only — never voice Claude/GPT sessions, prior agents, UUIDs, or file codes in readable body prose;
(11) fs30 four analytical moves remain a quality checklist (identify / mechanism / foil / limit) and may be present implicitly in continuous prose; they must NOT appear as visible Identify/Mechanism/Foil/Limit section labels or a four-beat echo in output unless a future field-spec change re-requires labeled scaffolding.
