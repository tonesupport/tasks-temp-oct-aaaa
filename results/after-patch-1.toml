notes = '''
Surfaced by a direct, requested audit of the formal-duress route/chain (field.toml route = 'formal-duress', 'formal-duress-chart', 'formal-duress-profile' -- Survey, Chart, and Profile all produced and exported to route/formal-duress.txt in one session) against fs30's four-move bar, entry by entry rather than assumed. 13 of 18 bar-applicable entries hit all four moves cleanly. The other 5 show the same gap twice, not five different gaps: all three Gen2 comparative-axis entries (survey h6nb, i4tc; chart n3qw) state identify and mechanism but never an explicit limit of the axis's own claim -- they caution against misusing the finding elsewhere, which isn't the same move as naming where the split itself might break down. Two of four Profile claim entries (s2fc, t6ld) state identify and mechanism but never set up an explicit foil, reading as pure exposition rather than comparison.

Open question this task exists to hold: is this a production lapse to just fix by writing better axis and claim entries next time, or is it evidence that fs30's identify/mechanism/foil/limit shape, built with candidate entries in mind, doesn't map cleanly onto axis entries (which compare candidates rather than argue one) or onto claim entries (which explicate a text's assertion rather than stake one)? If the latter, fs30 may need an entry-type-aware amendment rather than treating all thick content as one shape. Feeds directly into w4tn's eventual 10-route sample -- this is one data point toward that question, not a standalone fix.
'''
created = 2609191300
updated = 2609191300
