[9k2m]
title = 'Formalize field-spec.toml gaps found during the geomap/cs-geotopo route'
status = 'done'
domain = 'fieldguide'
project = 'field-spec'
notes = '''
The locked draft (field-spec.toml) is silent on several mechanics this session had to
improvise: where field.toml itself lives on disk; whether a Chart or Profile descent
needs a field carrying the frame/inset relationship explicitly (an "upstream"-style
field was added ad hoc, never proposed as a spec amendment); whether a thin-weight
Survey's atomicity bar matches a thick one's (one entry naming several candidates, or
one entry per candidate regardless of weight); what a downstream Chart or a later
direct instruction should do when it retracts or eliminates content an upstream grain
already committed (this session's practice was append-only correction notes, never
silent rewrites, but that's a convention this session invented, not one the spec
states). Full reasoning and the specific incidents that surfaced each gap are in
260917-001-field-engine-route-retrospective.md, same directory.

Resolved by direct user instruction, recorded here so the eventual repair locks in
the right version rather than an earlier wrong guess: a five-candidate "Next
Directions" style close is Profile-grain only, never Survey or Chart — conceived as
five waypoints that take a finished Profile further into applicable depth with the
whole chain's upstream in mind, meant to let a genuinely productive line of inquiry
keep generating runs, not a neutral menu. Survey and Chart Gen3 keep naming a single
candidate as today.

Newly surfaced, still open: "route" is overloaded. The existing field.toml field
(the shared identifier tying one Survey/Chart/Profile instance's entries together,
e.g. what this session called geomap or cs-geotopo-chart) collides with the user's
separate, intended meaning for "route" — an after-the-fact traced path between two
nodes, extracted on demand via the CLI and numbered as a reportable output in its
own right, distinct from a live, forward-moving "chain" of connected runs (marked at
creation, not reconstructed later). Recommended fix, not yet confirmed: rename the
existing per-instance field from route to instance, since fs18 already uses that
exact word to describe what it does, freeing "route" for the CLI-extracted-path
sense. Separately: whether "chain" needs its own stored field is genuinely open.
Chain membership looks fully derivable as the connected component under the
upstream and way edges together, except for one ambiguous case — a fresh top-level
entry with neither field could mean "deliberately starting a new chain" or "forgot
to link this." Leaning toward one minimal marker (a chain_start flag or tag) on
only the first entry of a deliberate new chain, rather than a chain id stamped on
every entry, so the graph stays the single source of truth and only the one
genuinely ambiguous bit gets recorded explicitly.

Resolved: chain_start splits into two tags, not one. A tag of view marks a chain
that began informally — the field-spec's existing View concept (fs17) is currently
defined as never itself becoming a field entry, which stays true for the View's
actual content; only a chain-topology marker touches field.toml, not the View's
substance, so this is a small, deliberate amendment to fs17 worth stating explicitly
in the spec text rather than leaving implicit. A tag of chain_start (kept, narrowed)
covers the other case: a chain beginning directly at Survey grain with no preceding
View. Either tag on a top-level entry means the same thing to a chain query — stop
here, do not look for an upstream or way link — they just record which flavor of
origin it was.

Resolved: speed is deliberately informal and stays that way — no metadata field, no
per-run dial. The user sets it by conversationally bundling requests ("let's do X,
Y, and Z"), separate from depth, which is a spec-owned property of grain. Worth one
remark in the spec's own prose (the primer, most likely) documenting this as the
intended mechanism rather than an omission, since otherwise a future reader could
mistake the absence of a speed field for an unaddressed gap.

Resolved: report timing is per-run, not mid-run. A dense, full-fidelity report is
owed once a run completes and the next node or a post-View Plumb is reached — not
as incremental narration while a run is in progress. This reverses an earlier
assumption (modeled on the old topos workflow's "Gen1 running... Gen1 complete..."
mid-run pings) that no longer applies here.

See also fcli's own notes for the instance/route schema this same conversation
worked out — a rime-spine-shaped seq of nodes, concatenable into an exported field
guide, with route as the specific case of a named start and end node. That design
lives there since it's CLI shape, not a spec-text change, but the two are adjacent
enough that formalizing this task's items should reference it.

Closed by field.toml's srp1 self-repair entry: field-spec.toml fs21 through fs29
appended, with pointer notes on fs16/fs17/fs18. field.tcl itself (7q4x) is still
open and unaffected by this closure — the instance/route and speed/depth items are
now spec text, not yet code.
'''
created = 2609170445
updated = 2609301138
tags = ['task', 'field-spec']
completed = 2609291200

